[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pitchlens"
version = "0.1.0"
description = "Map football players from a broadcast frame onto a 2D pitch and measure team shape, lines and passing lanes."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "numpy>=1.24",
  "opencv-python-headless>=4.8",
  "scikit-learn>=1.3",
  "scipy>=1.10",
  "matplotlib>=3.7",
  "ultralytics>=8.3",
]

[project.optional-dependencies]
app = ["gradio>=5"]
dev = ["pytest>=7", "ruff>=0.5"]

[project.scripts]
pitchlens = "pitchlens.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B905"]

[tool.ruff.lint.per-file-ignores]
"examples/*" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
